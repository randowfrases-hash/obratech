<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Cuenta – ObraTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary":             "#FF9900",
                        "background-dark":     "#121212",
                        "surface-dark":        "#1A1A1A",
                        "surface-2":           "#242424",
                        "text-main-dark":      "#E0E0E0",
                        "text-secondary-dark": "#A0A0A0",
                    },
                    fontFamily: { "display": ["Work Sans", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        input:-webkit-autofill, input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #1A1A1A inset !important;
            -webkit-text-fill-color: #E0E0E0 !important;
        }
        select option { background: #1A1A1A; color: #E0E0E0; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn .5s ease-out both; }
        .role-radio:checked + div {
            border-color: #FF9900;
            background-color: rgba(255, 153, 0, 0.1);
        }
        .role-radio:checked + div .icon-box {
            background-color: #FF9900;
            color: #121212;
        }
    </style>
</head>

<body class="bg-background-dark font-display min-h-screen flex items-center justify-center p-4">

    <!-- Fondo decorativo -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md space-y-6 fade-in py-8">

        <!-- Logo -->
        <div class="flex justify-center">
            <a href="/">
                <div class="flex items-center justify-center w-20 h-20 bg-primary rounded-2xl shadow-lg shadow-primary/30">
                    <span class="material-symbols-outlined text-background-dark text-5xl">construction</span>
                </div>
            </a>
        </div>

        <!-- Título -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-text-main-dark">Crea tu cuenta</h1>
            <p class="text-text-secondary-dark text-sm mt-1">Únete a ObraTech y conecta proyectos con personas</p>
        </div>

        <!-- Mensaje del servidor -->
        <div th:if="${mensaje}" class="px-1">
            <div class="flex items-start gap-3 bg-red-500/15 border border-red-500/40 text-red-400 px-4 py-3 rounded-xl text-sm">
                <span class="material-symbols-outlined text-base mt-0.5 shrink-0">error</span>
                <span th:text="${mensaje}"></span>
            </div>
        </div>
        <div th:if="${exito}" class="px-1">
            <div data-auto-dismiss="5000"
                 class="flex items-start gap-3 bg-green-500/15 border border-green-500/40 text-green-400 px-4 py-3 rounded-xl text-sm">
                <span class="material-symbols-outlined text-base mt-0.5 shrink-0">check_circle</span>
                <span th:text="${exito}"></span>
            </div>
        </div>

        <!-- Error de validación JS -->
        <div id="registro-error"
             class="hidden flex items-center gap-2 bg-red-500/15 border border-red-500/40 text-red-400 px-4 py-3 rounded-xl text-sm mx-1">
        </div>

        <!-- Tarjeta formulario -->
        <div class="bg-surface-dark border border-white/10 rounded-2xl p-8 shadow-2xl">
            <form id="registro-form" th:action="@{/registro}" method="post" class="space-y-5" novalidate>

                <!-- Correo -->
                <div>
                    <label class="block text-text-main-dark text-sm font-medium mb-2">Correo Electrónico</label>
                    <div class="flex items-stretch rounded-xl overflow-hidden bg-surface-2 border border-white/10
                                focus-within:border-primary/60 focus-within:ring-1 focus-within:ring-primary/40 transition-all">
                        <span class="flex items-center pl-4 text-text-secondary-dark">
                            <span class="material-symbols-outlined text-xl">mail</span>
                        </span>
                        <input type="email" name="username" id="reg-username"
                               class="flex-1 bg-transparent text-text-main-dark placeholder:text-text-secondary-dark
                                      px-3 py-3.5 text-sm outline-none"
                               placeholder="ejemplo@email.com"
                               autocomplete="email" required />
                    </div>
                </div>

                <!-- Contraseña -->
                <div>
                    <label class="block text-text-main-dark text-sm font-medium mb-2">Contraseña</label>
                    <div class="password-wrapper flex items-stretch rounded-xl overflow-hidden bg-surface-2 border border-white/10
                                focus-within:border-primary/60 focus-within:ring-1 focus-within:ring-primary/40 transition-all">
                        <span class="flex items-center pl-4 text-text-secondary-dark">
                            <span class="material-symbols-outlined text-xl">lock</span>
                        </span>
                        <input type="password" name="password" id="reg-password"
                               class="flex-1 bg-transparent text-text-main-dark placeholder:text-text-secondary-dark
                                      px-3 py-3.5 text-sm outline-none"
                               placeholder="Mínimo 8 caracteres"
                               autocomplete="new-password" required />
                        <button type="button" onclick="togglePasswordVisibility(this)"
                                aria-label="Mostrar/Ocultar contraseña"
                                class="flex items-center pr-4 text-text-secondary-dark hover:text-text-main-dark transition-colors">
                            <span class="material-symbols-outlined text-xl">visibility</span>
                        </button>
                    </div>
                    <!-- Barra de fortaleza -->
                    <div class="mt-2 h-1.5 bg-surface-2 rounded-full overflow-hidden">
                        <div id="password-strength-bar" class="h-full w-0 rounded-full transition-all duration-300 bg-gray-600"></div>
                    </div>
                    <p id="password-strength-text" class="text-xs text-text-secondary-dark mt-1 h-4"></p>
                </div>

                <!-- Selección de roles del usuario -->
                <div>
                    <label class="block text-text-main-dark text-sm font-medium mb-4">Soy un... (puedes seleccionar varios)</label>
                    <div class="space-y-3">
                        <!-- Contratista -->
                        <label class="relative block cursor-pointer group">
                            <input type="checkbox" name="roles" value="contratista" class="peer sr-only" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all duration-300
                                        group-hover:bg-white/5 group-hover:border-primary/50
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(255,153,0,0.1)]">
                                <div class="w-12 h-12 rounded-xl bg-surface-dark border border-white/10 flex items-center justify-center shrink-0 transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(255,153,0,0.3)]">
                                    <span class="material-symbols-outlined text-text-secondary-dark transition-colors duration-300
                                                 peer-checked:text-background-dark group-hover:text-primary">engineering</span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-bold text-text-main-dark group-hover:text-primary transition-colors">Contratista</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Gestiono equipos y proyectos</p>
                                </div>
                                <div class="w-6 h-6 rounded-md border-2 border-white/20 flex items-center justify-center transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary">
                                    <span class="material-symbols-outlined text-background-dark text-[16px] scale-0 peer-checked:scale-100 transition-transform duration-200">check</span>
                                </div>
                            </div>
                        </label>
                        
                        <!-- Cliente -->
                        <label class="relative block cursor-pointer group">
                            <input type="checkbox" name="roles" value="cliente" class="peer sr-only" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all duration-300
                                        group-hover:bg-white/5 group-hover:border-primary/50
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(255,153,0,0.1)]">
                                <div class="w-12 h-12 rounded-xl bg-surface-dark border border-white/10 flex items-center justify-center shrink-0 transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(255,153,0,0.3)]">
                                    <span class="material-symbols-outlined text-text-secondary-dark transition-colors duration-300
                                                 peer-checked:text-background-dark group-hover:text-primary">person</span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-bold text-text-main-dark group-hover:text-primary transition-colors">Cliente</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Publico y contrato proyectos</p>
                                </div>
                                <div class="w-6 h-6 rounded-md border-2 border-white/20 flex items-center justify-center transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary">
                                    <span class="material-symbols-outlined text-background-dark text-[16px] scale-0 peer-checked:scale-100 transition-transform duration-200">check</span>
                                </div>
                            </div>
                        </label>

                        <!-- Trabajador -->
                        <label class="relative block cursor-pointer group">
                            <input type="checkbox" name="roles" value="trabajador" class="peer sr-only" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all duration-300
                                        group-hover:bg-white/5 group-hover:border-primary/50
                                        peer-checked:border-primary peer-checked:bg-primary/5 peer-checked:shadow-[0_0_20px_rgba(255,153,0,0.1)]">
                                <div class="w-12 h-12 rounded-xl bg-surface-dark border border-white/10 flex items-center justify-center shrink-0 transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary peer-checked:shadow-[0_0_15px_rgba(255,153,0,0.3)]">
                                    <span class="material-symbols-outlined text-text-secondary-dark transition-colors duration-300
                                                 peer-checked:text-background-dark group-hover:text-primary">construction</span>
                                </div>
                                <div class="flex-1">
                                    <p class="text-sm font-bold text-text-main-dark group-hover:text-primary transition-colors">Trabajador</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Busco oportunidades laborales</p>
                                </div>
                                <div class="w-6 h-6 rounded-md border-2 border-white/20 flex items-center justify-center transition-all duration-300
                                            peer-checked:bg-primary peer-checked:border-primary">
                                    <span class="material-symbols-outlined text-background-dark text-[16px] scale-0 peer-checked:scale-100 transition-transform duration-200">check</span>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Términos -->
                <label class="flex items-start gap-3 cursor-pointer mt-4 group">
                    <div class="relative mt-1">
                        <input type="checkbox" id="acepta-terminos" required class="peer sr-only" />
                        <div class="w-5 h-5 rounded border-2 border-white/20 bg-surface-2 transition-all duration-300 
                                    peer-checked:bg-primary peer-checked:border-primary peer-focus:ring-2 peer-focus:ring-primary/40
                                    group-hover:border-primary/50 flex items-center justify-center">
                            <span class="material-symbols-outlined text-background-dark text-[14px] scale-0 peer-checked:scale-100 transition-transform duration-200">
                                check
                            </span>
                        </div>
                    </div>
                    <span class="text-text-secondary-dark text-sm leading-relaxed group-hover:text-text-main-dark transition-colors">
                        Acepto los
                        <a href="#" class="text-primary font-medium hover:underline">Términos y Condiciones</a>
                        y la
                        <a href="#" class="text-primary font-medium hover:underline">Política de Privacidad</a>
                    </span>
                </label>

                <!-- Botones -->
                <div class="flex gap-3 pt-2">
                    <button type="submit"
                            class="flex-[2] bg-primary text-background-dark font-bold py-3.5 rounded-xl
                                   text-sm uppercase tracking-wide hover:bg-orange-400 active:scale-95
                                   transition-all duration-200 shadow-[0_0_15px_rgba(255,153,0,0.3)] hover:shadow-[0_0_25px_rgba(255,153,0,0.5)]">
                        Crear Cuenta
                    </button>
                    <button type="button" onclick="window.location.href='/index'"
                            class="flex-1 bg-surface-2 text-text-main-dark font-medium py-3.5 rounded-xl
                                   text-sm border border-white/10 hover:bg-white/10 active:scale-95
                                   transition-all duration-200">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-text-secondary-dark text-sm">
            ¿Ya tienes cuenta?
            <a href="/login" class="text-primary font-semibold hover:underline ml-1">Inicia sesión</a>
        </p>

        <!-- Divisor -->
        <div class="flex items-center gap-3">
            <hr class="flex-1 border-white/10" />
            <span class="text-text-secondary-dark text-xs">o continuar con</span>
            <hr class="flex-1 border-white/10" />
        </div>

        <!-- Social login -->
        <div class="space-y-3">
            <button onclick="window.location.href='/oauth2/authorization/google'"
                    class="w-full flex items-center justify-center gap-3 bg-surface-dark border border-white/10
                           text-text-main-dark py-3 rounded-xl text-sm font-medium hover:bg-white/10
                           active:scale-95 transition-all duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
                Continuar con Google
            </button>
        </div>

        <!-- Términos -->
        <p class="text-center text-text-secondary-dark text-xs pb-4">
            <a href="#" class="hover:text-primary hover:underline">Términos y Condiciones</a>
            <span class="mx-2">•</span>
            <a href="#" class="hover:text-primary hover:underline">Política de Privacidad</a>
        </p>
    </div>

    <script src="/js/obratech.js"></script>
    <script>
        // Validar checkbox de términos al enviar
        document.getElementById('registro-form').addEventListener('submit', function(e) {
            const check = document.getElementById('acepta-terminos');
            if (!check.checked) {
                e.preventDefault();
                const err = document.getElementById('registro-error');
                err.textContent = 'Debes aceptar los Términos y Condiciones para continuar.';
                err.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
