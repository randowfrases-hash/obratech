<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Completar Registro – ObraTech</title>
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary":             "#FF9900",
                        "background-dark":     "#121212",
                        "surface-dark":        "#1A1A1A",
                        "surface-2":           "#242424",
                        "text-main-dark":      "#E0E0E0",
                        "text-secondary-dark": "#A0A0A0",
                    },
                    fontFamily: { "display": ["Work Sans", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn .5s ease-out both; }
        /* Custom checkbox style */
        .role-radio:checked + div {
            border-color: #FF9900;
            background-color: rgba(255, 153, 0, 0.1);
        }
        .role-radio:checked + div .icon-box {
            background-color: #FF9900;
            color: #121212;
        }
    </style>
</head>

<body class="bg-background-dark font-display min-h-screen flex items-center justify-center p-4">

    
    <div class="fixed inset-0 pointer-events-none overflow-hidden">
        <div class="absolute top-1/3 right-1/4 w-96 h-96 bg-primary/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 left-1/4 w-64 h-64 bg-primary/3 rounded-full blur-2xl"></div>
    </div>

    <div class="relative w-full max-w-md space-y-6 fade-in py-8">

        <!-- Logo -->
        <div class="flex justify-center">
            <div class="flex items-center justify-center w-20 h-20 bg-primary rounded-2xl shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-background-dark text-5xl">how_to_reg</span>
            </div>
        </div>

        <!-- Título -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-text-main-dark">¡Casi listo!</h1>
            <p class="text-text-secondary-dark text-sm mt-1">Completa tu perfil seleccionando cómo usarás ObraTech</p>
        </div>

        <!-- Mensaje del servidor -->
        <div th:if="${mensaje}" class="px-1">
            <div class="flex items-start gap-3 bg-red-500/15 border border-red-500/40 text-red-400 px-4 py-3 rounded-xl text-sm">
                <span class="material-symbols-outlined text-base mt-0.5 shrink-0">error</span>
                <span th:text="${mensaje}"></span>
            </div>
        </div>

        <!-- Error de validación JS -->
        <div id="registro-error"
             class="hidden flex items-center gap-2 bg-red-500/15 border border-red-500/40 text-red-400 px-4 py-3 rounded-xl text-sm mx-1">
        </div>

        <!-- Tarjeta formulario -->
        <div class="bg-surface-dark border border-white/10 rounded-2xl p-8 shadow-2xl">
            <form id="registro-form" th:action="@{/completar-registro-oauth2}" method="post" class="space-y-6" novalidate>
                
                <!-- Selección de roles del usuario -->
                <div>
                    <label class="block text-text-main-dark text-sm font-medium mb-3">Soy un... (puedes seleccionar varios)</label>
                    <div class="space-y-3">
                        <label class="block cursor-pointer group">
                            <input type="checkbox" name="roles" value="contratista" class="peer sr-only role-radio" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all hover:bg-white/5">
                                <div class="w-5 h-5 rounded border border-white/20 flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors icon-box">
                                    <span class="material-symbols-outlined text-[14px] text-background-dark opacity-0 peer-checked:opacity-100">check</span>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold text-text-main-dark">Contratista</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Gestiono equipos y proyectos</p>
                                </div>
                            </div>
                        </label>
                        
                        <label class="block cursor-pointer group">
                            <input type="checkbox" name="roles" value="cliente" class="peer sr-only role-radio" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all hover:bg-white/5">
                                <div class="w-5 h-5 rounded border border-white/20 flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors icon-box">
                                    <span class="material-symbols-outlined text-[14px] text-background-dark opacity-0 peer-checked:opacity-100">check</span>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold text-text-main-dark">Cliente</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Publico y contrato proyectos</p>
                                </div>
                            </div>
                        </label>

                        <label class="block cursor-pointer group">
                            <input type="checkbox" name="roles" value="trabajador" class="peer sr-only role-radio" />
                            <div class="flex items-center gap-4 p-4 rounded-xl border border-white/10 bg-surface-2 transition-all hover:bg-white/5">
                                <div class="w-5 h-5 rounded border border-white/20 flex items-center justify-center peer-checked:bg-primary peer-checked:border-primary transition-colors icon-box">
                                    <span class="material-symbols-outlined text-[14px] text-background-dark opacity-0 peer-checked:opacity-100">check</span>
                                </div>
                                <div>
                                    <p class="text-sm font-semibold text-text-main-dark">Trabajador</p>
                                    <p class="text-xs text-text-secondary-dark mt-0.5">Busco oportunidades laborales</p>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Sección de Contraseña (Nueva) -->
                <div class="space-y-4">
                    <div class="relative">
                        <label class="block text-text-main-dark text-sm font-medium mb-2">Establece una contraseña</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary-dark group-focus-within:text-primary transition-colors">lock</span>
                            <input type="password" name="password" id="password" required
                                   class="w-full bg-surface-2 border border-white/10 rounded-xl py-3.5 pl-12 pr-4
                                          text-text-main-dark placeholder:text-text-secondary-dark/50
                                          focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"
                                   placeholder="Mínimo 8 caracteres" />
                        </div>
                    </div>

                    <div class="relative">
                        <label class="block text-text-main-dark text-sm font-medium mb-2">Confirma tu contraseña</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary-dark group-focus-within:text-primary transition-colors">lock_reset</span>
                            <input type="password" id="confirm-password" required
                                   class="w-full bg-surface-2 border border-white/10 rounded-xl py-3.5 pl-12 pr-4
                                          text-text-main-dark placeholder:text-text-secondary-dark/50
                                          focus:outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/50 transition-all"
                                   placeholder="Repite tu contraseña" />
                        </div>
                    </div>
                </div>

                <!-- Términos -->
                <label class="flex items-start gap-3 cursor-pointer mt-4">
                    <input type="checkbox" id="acepta-terminos" required
                           class="mt-1 w-5 h-5 rounded border-white/20 bg-surface-2 accent-primary shrink-0 cursor-pointer" />
                    <span class="text-text-secondary-dark text-sm leading-relaxed">
                        Acepto los
                        <a href="#" class="text-primary font-medium hover:underline">Términos y Condiciones</a>
                        y la
                        <a href="#" class="text-primary font-medium hover:underline">Política de Privacidad</a>
                    </span>
                </label>

                <!-- Botones -->
                <div class="flex gap-3 pt-2">
                    <button type="submit"
                            class="flex-[2] bg-primary text-background-dark font-bold py-3.5 rounded-xl
                                   text-sm uppercase tracking-wide hover:bg-orange-400 active:scale-95
                                   transition-all duration-200 shadow-[0_0_15px_rgba(255,153,0,0.3)] hover:shadow-[0_0_25px_rgba(255,153,0,0.5)]">
                        Continuar
                    </button>
                    <button type="button" onclick="window.location.href='/logout'"
                            class="flex-1 bg-surface-2 text-text-main-dark font-medium py-3.5 rounded-xl
                                   text-sm border border-white/10 hover:bg-white/10 active:scale-95
                                   transition-all duration-200">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Validar checkbox de términos al enviar
        document.getElementById('registro-form').addEventListener('submit', function(e) {
            const check = document.getElementById('acepta-terminos');
            const roles = document.querySelectorAll('input[name="roles"]:checked');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const err = document.getElementById('registro-error');
            
            err.classList.add('hidden');

            if (roles.length === 0) {
                e.preventDefault();
                err.textContent = 'Debes seleccionar al menos un rol para continuar.';
                err.classList.remove('hidden');
                return;
            }

            if (password.length < 8) {
                e.preventDefault();
                err.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                err.classList.remove('hidden');
                return;
            }

            if (password !== confirmPassword) {
                e.preventDefault();
                err.textContent = 'Las contraseñas no coinciden.';
                err.classList.remove('hidden');
                return;
            }

            if (!check.checked) {
                e.preventDefault();
                err.textContent = 'Debes aceptar los Términos y Condiciones para continuar.';
                err.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
