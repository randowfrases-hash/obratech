spring.application.name=obratech
server.port=${PORT:9999}
spring.devtools.livereload.enabled=false

# ── Encoding UTF-8 ────────────────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.mandatory-file-encoding=UTF-8

# ── Base de datos (MongoDB) ───────────────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb+srv://estudiante:weimar190207@cluster0.cwmfs3s.mongodb.net/?appName=Cluster0}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:obratech}

# ── Redis para sesiones ───────────────────────────────────────────────────────
# Prioridad 1: URL de conexion completa (ej. rediss://default:contrasea@servidor.upstash.io:6379)
spring.data.redis.url=${SPRING_DATA_REDIS_URL:}
# Prioridad 2: Configuaracin por propiedades individuales
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.session.store-type=redis


# ── Sesión y cookie ───────────────────────────────────────────────────────────
# Administración de sesiones
server.servlet.session.cookie.name=OBRATECH_SESSION
# evita acceso desde JS
server.servlet.session.cookie.http-only=true
# true en producción (HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# protección CSRF adicional
server.servlet.session.cookie.same-site=Lax
# 24h cookie en browser
server.servlet.session.cookie.max-age=86400
# 2h inactividad en servidor
server.servlet.session.timeout=2h

# ── Subida de archivos ────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB

# ── Seeder de datos de prueba  ──────────────────
app.seed.enabled=false

# ── Manejo de errores  ─────────────────────
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

# ----- 
spring.jmx.enabled=false
spring.application.admin.enabled=false
spring.devtools.restart.enabled=false

# ── OAuth2  ─────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:tu-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:tu-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# ── JWT ───────────────────────────────────────────────────────────────────────

